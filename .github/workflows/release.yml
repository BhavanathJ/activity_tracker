name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4.1.7

      - name: Setup .NET
        uses: actions/setup-dotnet@v4.0.1
        with:
          dotnet-version: '8.0.x'

      - name: Extract version
        id: version
        shell: pwsh
        run: |
          if ('${{ github.ref }}' -like 'refs/tags/v*') {
            $ver = '${{ github.ref_name }}' -replace '^v', ''
          } else {
            $ver = '0.0.0-dev'
          }
          "VERSION=$ver" >> $env:GITHUB_OUTPUT
          Write-Host "Version: $ver"

      - name: Publish Service
        shell: pwsh
        run: >
          dotnet publish ActivityTracker.Service/ActivityTracker.Service.csproj
          -c Release -r win-x64 --self-contained true
          -o out/service

      - name: Publish SessionAgent
        shell: pwsh
        run: >
          dotnet publish ActivityTracker.SessionAgent/ActivityTracker.SessionAgent.csproj
          -c Release -r win-x64 --self-contained true
          -o out/agent

      - name: Publish CLI
        shell: pwsh
        run: >
          dotnet publish ActivityTracker.Cli/ActivityTracker.Cli.csproj
          -c Release -r win-x64 --self-contained true
          -o out/cli

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build installer
        shell: pwsh
        run: >
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          /DVersion=${{ steps.version.outputs.VERSION }}
          /DServiceDir=out\service
          /DAgentDir=out\agent
          /DCliDir=out\cli
          installer\ActivityTracker.iss

      - name: Create Extension zips
        shell: pwsh
        run: |
          $ver = "${{ steps.version.outputs.VERSION }}"
          New-Item -ItemType Directory -Path "installer/output" -Force
          foreach ($browser in @("brave", "chrome", "edge")) {
            $stageDir = "out/ext-$browser"
            New-Item -ItemType Directory -Path $stageDir -Force
            Copy-Item -Path "Extension/*" -Destination $stageDir -Recurse -Exclude "config.js"
            Copy-Item -Path "installer/ext-config/$browser/config.js" -Destination "$stageDir/config.js"
            Compress-Archive -Path "$stageDir/*" -DestinationPath "installer/output/ActivityTracker-Extension-$browser-$ver.zip" -Force
          }

      - name: Compute checksums
        shell: pwsh
        run: |
          $lines = @()
          Get-ChildItem -Path "installer\output" -File | Where-Object { $_.Name -ne "checksums.txt" } | Sort-Object Name | ForEach-Object {
            $hash = (Get-FileHash -Path $_.FullName -Algorithm SHA256).Hash
            $lines += "$hash  $($_.Name)"
          }
          $lines | Set-Content "installer\output\checksums.txt"
          Get-Content "installer\output\checksums.txt"

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4.4.3
        with:
          name: ActivityTracker-${{ steps.version.outputs.VERSION }}
          path: installer/output/*

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2.0.8
        with:
          name: Activity Tracker v${{ steps.version.outputs.VERSION }}
          body: |
            ## Activity Tracker v${{ steps.version.outputs.VERSION }}

            ### Installation
            1. Download `ActivityTracker-Setup-${{ steps.version.outputs.VERSION }}.exe` below.
            2. Run it and follow the installer prompts.
            3. After install, load the browser extension for your browser (Chrome, Brave, or Edge).
            4. Open a new terminal and run `tracker live` to verify.

            ### Verify download
            Compare the SHA-256 hash of your downloaded file against `checksums.txt`.
          files: |
            installer/output/*
